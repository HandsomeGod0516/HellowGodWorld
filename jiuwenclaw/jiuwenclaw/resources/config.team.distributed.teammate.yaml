# 前端顯示語言：zh（中文）/ en（英文），與 Web 介面語言切換同步
preferred_language: zh

# 日誌目錄：~/.jiuwenclaw/agent/.logs/
# gateway.log / channel.log / agent_server.log 按原始碼路徑分流；full.log 為彙總。
# level：未單獨指定時的預設級別。console_level：控制檯；可省略則用 level。
# 環境變數 LOG_LEVEL 僅覆蓋控制檯級別（不覆蓋各日誌檔案）。
logging:
  level: INFO
  console_level: INFO
  gateway: INFO
  channel: INFO
  agent_server: INFO
  full: INFO

memory:
  # ============================================================
  # 記憶系統配置
  # ============================================================
  # 兩個正交開關：
  #   1) engine — 掛載哪套 rail（內建 / 外接 / 都掛 / 都不掛）
  #   2) mode   — 內建記憶的儲存位置（local | cloud），不影響外接
  #
  # 外接 rail 的啟用 = (engine ∈ {external, both}) AND (external.provider 非空)
  # 內建 rail 的啟用 = (engine ∈ {builtin, both})  AND (mode=local)
  #                    AND modes.agent.<當前 mode>.memory.enabled=true
  # ============================================================

  mode: ${MEMORY_MODE:-local}            # 內建記憶儲存位置：local | cloud
  # 記憶引擎總開關：builtin | external | both | none
  #   builtin  — 僅內建記憶（預設，相容舊配置）
  #   external — 僅外接記憶（LTM / Mem0 / OpenViking / 外掛）
  #   both     — 內建 + 外接並存
  #   none     — 全部關閉
  engine: ${MEMORY_ENGINE:-builtin}
  forbidden_memory_definition:
    enabled: false
    patterns: []
    description:
      zh: "以下內容禁止記憶：密碼、API金鑰、Secret、Token、信用卡號、身份證號、手機號等敏感資訊"
      en: "The following content is forbidden to remember: passwords, API keys, secrets, tokens, credit card numbers, ID numbers, phone numbers and other sensitive information"

  # ------------------------------------------------------------
  # 外接記憶（External Memory）
  # ------------------------------------------------------------
  # 啟用方式（任選一種）：
  #
  # 【方案 1：YAML 直接改】
  #   memory.engine: external   # 或 both
  #   memory.external.provider: mem0   # 選一個：openjiuwen | mem0 | openviking
  #   # 然後在下方對應的 mem0/openjiuwen/openviking 子段填 api_key 或 endpoint
  #
  # 【方案 2：環境變數覆蓋】
  #   export MEMORY_ENGINE=external
  #   export MEMORY_EXTERNAL_PROVIDER=mem0
  #   export MEM0_API_KEY=sk-xxx
  #
  # 【關閉外接記憶】
  #   把 memory.engine 改回 builtin 或 none；
  #   或把 memory.external.provider 留空（兩者任一生效即可禁用）
  #
  # 【掛載模式常見組合】
  #   ┌─────────────┬───────────────┬──────────────────────────────────────┐
  #   │ engine      │ provider      │ 效果                                 │
  #   ├─────────────┼───────────────┼──────────────────────────────────────┤
  #   │ builtin     │ *             │ 只掛內建（預設；外接即使填了也不掛） │
  #   │ external    │ openjiuwen    │ 只掛外接 LTM                         │
  #   │ external    │ mem0          │ 只掛外接 Mem0                        │
  #   │ external    │ openviking    │ 只掛外接 OpenViking                  │
  #   │ external    │ <plugin-name> │ 只掛使用者安裝的外掛                   │
  #   │ both        │ 任一          │ 內建 + 外接同時掛（LLM 兩套工具並列）│
  #   │ none        │ *             │ 全關，任何記憶 rail 都不掛           │
  #   └─────────────┴───────────────┴──────────────────────────────────────┘
  #
  # 說明：
  # - 外接記憶 mode-independent：配置一次，plan / fast 模式全程生效，
  #   跨 config 熱過載持久存活（保留 prefetch 快取、電路斷路器、會話狀態）
  # - 單 provider 策略：同一時刻 provider 只能選一個
  # - 失敗降級：provider 構建失敗或網路異常不阻塞主流程
  external:
    # 選哪家 provider。空字串 = 禁用外接（等價於 engine=builtin）
    provider: ${MEMORY_EXTERNAL_PROVIDER:-}   # '' | openjiuwen | mem0 | openviking | <plugin-name>
    # 資料隔離標識（所有 provider 共用）
    user_id: ${MEMORY_USER_ID:-__default__}
    scope_id: ${MEMORY_SCOPE_ID:-__default__}

    # -- OpenJiuwen LTM（本地長期記憶：KV + 向量 + DB）--
    # 生效條件：provider='openjiuwen'
    # 依賴頂層 embed 段提供 embedding 配置（不單獨配置 api_key）
    openjiuwen:
      kv_type: shelve                                    # shelve | in_memory | sqlite
      kv_path: ${MEMORY_KV_PATH:-}                       # 預設 ~/.jiuwenclaw/memory/ltm/kv
      vector_type: chroma                                # chroma
      vector_persist_dir: ${MEMORY_VECTOR_DIR:-}         # 預設 ~/.jiuwenclaw/memory/ltm/chroma
      db_type: sqlite
      db_path: ${MEMORY_DB_PATH:-}                       # 預設 ~/.jiuwenclaw/memory/ltm/ltm.db

    # -- Mem0（雲端事實抽取+語義檢索）--
    # 生效條件：provider='mem0'
    # 必填：api_key（從 mem0.ai 獲取）
    mem0:
      api_key: ${MEM0_API_KEY:-}
      user_id: ${MEM0_USER_ID:-jiuwenclaw-user}
      agent_id: ${MEM0_AGENT_ID:-jiuwenclaw}
      rerank: true                                       # 搜尋結果重排序（更準但更慢）

    # -- OpenViking（位元組上下文資料庫）--
    # 生效條件：provider='openviking'
    # 必填：endpoint 可訪問
    openviking:
      endpoint: ${OPENVIKING_ENDPOINT:-http://127.0.0.1:1933}
      api_key: ${OPENVIKING_API_KEY:-}
      account: ${OPENVIKING_ACCOUNT:-root}
      user: ${OPENVIKING_USER:-default}

models:
  default:
    model_client_config:
      api_base: ${API_BASE}
      api_key: ${API_KEY}
      model_name: ${MODEL_NAME:-xiaomi/mimo-v2-omni}
      client_provider: ${MODEL_PROVIDER}
      timeout: 1800
      verify_ssl: false
      custom_headers: {}
    model_config_obj:
      temperature: 0.95
  video:
    model_client_config:
      api_base: ${VIDEO_API_BASE}
      api_key: ${VIDEO_API_KEY}
      model_name: ${VIDEO_MODEL_NAME:-xiaomi/mimo-v2-omni}
      client_provider: ${VIDEO_PROVIDER}
      timeout: 1800
      verify_ssl: false
    model_config_obj:
      temperature: 0.95
  audio:
    model_client_config:
      api_base: ${AUDIO_API_BASE}
      api_key: ${AUDIO_API_KEY}
      model_name: ${AUDIO_MODEL_NAME:-openai/gpt-4o-audio-preview}
      client_provider: ${AUDIO_PROVIDER}
      verify_ssl: false
      timeout: 1800
    model_config_obj:
      temperature: 0.95
  vision:
    model_client_config:
      api_base: ${VISION_API_BASE}
      api_key: ${VISION_API_KEY}
      model_name: ${VISION_MODEL_NAME:-bytedance-seed/seed-2.0-mini}
      client_provider: ${VISION_PROVIDER}
      verify_ssl: false
      timeout: 1800
    model_config_obj:
      temperature: 0.95
  image_gen:
    model_client_config:
      api_base: ${IMAGE_GEN_API_BASE:-https://dashscope.aliyuncs.com/api/v1}
      api_key: ${IMAGE_GEN_API_KEY}
      model_name: ${IMAGE_GEN_MODEL_NAME:-qwen-image-max}
      client_provider: ${IMAGE_GEN_PROVIDER:-DashScope}
      verify_ssl: false
      timeout: 1800
    model_config_obj:
      temperature: 0.95

telemetry:
  enabled: false                    # 總開關（環境變數 OTEL_ENABLED 優先）
  exporter: otlp                    # otlp / console / none
  endpoint: http://localhost:4317   # OTLP endpoint
  protocol: grpc                    # grpc / http
  headers: {}                       # 公共 OTLP headers，可被 traces/metrics 覆蓋
  log_messages: true                # 是否在 span event 中記錄完整訊息內容
  service_name: jiuwenclaw
  provider_factory:                 # 自定義 provider factory，格式：module:function
  traces:
    exporter:                       # trace exporter，預設回退到 telemetry.exporter
    endpoint:                       # trace endpoint，預設回退到 telemetry.endpoint
    protocol:                       # trace protocol，預設回退到 telemetry.protocol
    headers: {}                     # trace headers，預設回退到 telemetry.headers
  metrics:
    exporter:                       # metrics exporter，預設回退到 telemetry.exporter
    endpoint:                       # metrics endpoint，預設回退到 telemetry.endpoint
    protocol:                       # metrics protocol，預設回退到 telemetry.protocol
    headers: {}                     # metrics headers，預設回退到 telemetry.headers

react:
  agent_name: main_agent
  max_iterations: 100
  model_name: ${MODEL_NAME:-deepseek-chat}
  skill_mode: all
  # code_agent / research_agent 預設不啟用；只有顯式配置 enabled: true 才會顯示並可被 task_tool 呼叫
  # browser_agent 保持原行為，仍由瀏覽器 runtime 開關決定是否預設註冊；這裡只支援覆蓋其引數
  subagents:
    code_agent:
      enabled: false
      # max_iterations: 15
    research_agent:
      enabled: false
      # max_iterations: 15
  answer_chunk_size: 500
  stream_chunk_threshold: 50
  stream_character_threshold: 2000
  context_engine_config:
    enable_kv_cache_release: false
    enable_reload: true
    enabled: true
    message_summary_offloader_config:
      messages_threshold:
      tokens_threshold: 60000
      large_message_threshold: 60000
      offload_message_type: ["tool"]
      protected_tool_names: ["read_file:*SKILL.md", "reload_original_context_messages"]
      messages_to_keep:
      keep_last_round: false
      customized_summary_prompt:
      enable_adaptive_compression: true
      summary_max_tokens: 900
      enable_precise_step: false
      step_summary_max_context_messages: 8
      content_max_chars_for_compression: 200000
    dialogue_compressor_config:
      messages_threshold:
      tokens_threshold: 100000
      messages_to_keep: 10
      keep_last_round: false
      compression_target_tokens: 1800
      offload_writeback_enabled: false
    current_round_compressor_config:
      tokens_threshold: 100000
      messages_to_keep: 3
      min_selected_tokens_for_compression: 20000
      compression_target_tokens: 4000
      summary_merge_target_tokens: 4000
      accumulated_summary_token_limit: 20000
      summary_merge_min_blocks: 3
      prior_context_window_size: 10
      offload_writeback_enabled: false
    round_level_compressor_config:
      rounds_threshold: 2
      tokens_threshold: 230000
      trigger_total_tokens: 230000
      target_total_tokens: 160000
      compression_call_max_tokens: 250000
      keep_last_round: true
      keep_recent_messages: 6
      messages_to_keep: 6
      first_pass_target_tokens: 30000
      second_pass_target_tokens: 20000
      third_pass_target_tokens: 10000
      truncate_head_ratio: 0.2
      offload_writeback_enabled: false
  # Skills 線上自演進配置
  evolution:
    enabled: true             # true = 啟用線上 Skills 自演進
    auto_scan: false           # true = 每輪對話後自動掃描（建議先用手動 /evolve）
    skill_base_dir: "agent/skills"  # Skill 根目錄
  a2x_registry:
    base_url: "http://127.0.0.1:8000"
    timeout: 30.0
    api_key: ""
    # null uses the SDK default ownership store under the process HOME.
    # Keep ownership persistent so teardown can call replace_agent_card safely.
    ownership_file:
    # Allowed values: teammate / teamleader
    role: "teammate"
    # When role=teammate, automatic blank-agent registration during agent
    # initialization calls AsyncA2XRegistryClient.register_blank_agent(...).
    # Both dataset and endpoint must be configured explicitly; if either is
    # missing, auto-registration is skipped and only a log is recorded.
    dataset: "team_pool"
    endpoint: "tcp://127.0.0.1:28610"

tools:
  - todo
  - skill

email_settings:
  email_address: ${EMAIL_ADDRESS}
  token: ${EMAIL_TOKEN}
  smtp_server: ${SMTP_SERVER:-smtp.gmail.com}
  port: ${EMAIL_PORT:-587}

embed:
  embed_api_key: ${EMBED_API_KEY}
  embed_base_url: ${EMBED_API_BASE}
  embed_model: ${EMBED_MODEL}

task_memory:
  # Set enabled: true to activate TaskMemoryService skill tools
  # (experience_retrieve, experience_learn, experience_clear)
  enabled: true
  # Override defaults below if task memory uses a different model/key than the main agent
  llm_model: ${TASK_MEMORY_LLM_MODEL}
  embedding_model: ${TASK_MEMORY_EMBED_MODEL}
  api_key: ${TASK_MEMORY_API_KEY}
  api_base: ${TASK_MEMORY_API_BASE}
  # Retrieval and summary algorithms: ACE | ReasoningBank | ReMe
  retrieval_algo: ACE
  summary_algo: ACE

gateway:
  # SessionMap 僅用於企業claw場景，如 feishu_enterprise 等通道：將平臺身份對映為 Agent 的 session_id。
  # 取值：per_chat_bot（預設，同 chat+bot 共享會話）, per_chat_bot_user（按 user 分會話）
  session_map_scope: per_chat_bot

heartbeat:
  # 心跳間隔（秒），預設 60
  every: 3600
  # 心跳結果回傳的 channel（如 "web"），
  target: web
  # 心跳生效時間段（本地時間），start <= now < end 時心跳生效
  active_hours:
    start: 08:00
    end: 22:00

channels:
  feishu:
    # 飛書應用配置
    app_id:
    app_secret:
    encrypt_key:
    verification_token:
    allow_from:
    enable_streaming: false
    enabled: false
    send_file_allowed: true
    # 群聊數字分身（預設關閉）
    group_digital_avatar: false
    my_user_id: ""
    bot_name: ""
    enable_memory: false
  feishu_enterprise:
    # 企業飛書多 Bot 配置（每個 bot 會註冊為獨立 channel: feishu_enterprise:<app_id>）
    # bot_a:
    #   app_id:
    #   app_secret:
    #   encrypt_key:
    #   verification_token:
    #   allow_from: []
    #   enable_streaming: true
    #   chat_id:
    #   enabled: false
  xiaoyi:
    # 華為小藝 A2A 配置
    mode: xiaoyi_channel
    ak:
    sk:
    api_id:
    push_id:
    agent_id:
    ws_url1: wss://hag.cloud.huawei.com/openclaw/v1/ws/link
    ws_url2: wss://116.63.174.231/openclaw/v1/ws/link
    enable_streaming: true
    enabled: false
    # xiaoyi_claw配置
    uid:
    api_key:
    push_url:
    file_upload_url:
    # 小藝手機端外掛tools呼叫，會新增相關tools到系統提示詞
    phone_tools_enabled: false
    send_file_allowed: true
  dingtalk:
    # 釘釘應用配置
    client_id:
    client_secret:
    allow_from: []
    enabled: false
    send_file_allowed: true
  telegram:
    # Telegram Bot 配置
    # 從 @BotFather 獲取 bot_token
    bot_token:
    # 使用者白名單（Telegram user_id），為空則允許所有使用者
    allow_from: []
    # 訊息解析模式: Markdown, HTML, None
    parse_mode: Markdown
    # 群聊模式: mention(僅響應@提及), reply(僅響應回覆), all(響應所有), off(禁用群聊)
    group_chat_mode: mention
    enabled: false
  discord:
    # Discord Bot 配置（當前版本僅支援引數管理）
    # 可與使用者私聊（DM）：仍受 allow_from 約束
    # Bot Token（Discord Developer Portal -> Bot）
    bot_token:
    # Application ID（Discord Developer Portal -> General Information）
    application_id:
    # 目標伺服器 ID（Guild ID）
    guild_id:
    # 目標頻道 ID（Channel ID）
    channel_id:
    # 使用者白名單（Discord user_id），為空則允許所有使用者
    allow_from: []
    # 是否關閉私信功能
    block_dm: false
    enabled: false
  whatsapp:
    # WhatsApp 配置（透過本地 Baileys bridge）
    bridge_ws_url: ws://127.0.0.1:19600/ws
    default_jid:
    allow_from: []
    enable_streaming: true
    auto_start_bridge: false
    bridge_command: node scripts/whatsapp-bridge.js
    bridge_workdir:
    enabled: false
  wechat:
    # 個人微信 iLink Bot API 配置
    enable_streaming: false
    base_url: https://ilinkai.weixin.qq.com
    bot_token:
    ilink_bot_id:
    ilink_user_id:
    allow_from: []
    auto_login: true
    qrcode_poll_interval_sec: 2.0
    long_poll_timeout_sec: 45
    backoff_base_sec: 1.0
    backoff_max_sec: 30.0
    credential_file: ~/.wx-ai-bridge/credentials.json
    enabled: false
  wecom:
    # 企業微信 AI 機器人配置
    bot_id:
    secret:
    ws_url: wss://openws.work.weixin.qq.com
    allow_from: []
    enable_streaming: true
    send_thinking_message: false
    enabled: false
    send_file_allowed: true
    # 群聊數字分身（預設關閉）
    group_digital_avatar: false
    my_user_id: ""
    bot_name: ""
    enable_memory: false

# ========== 細粒度許可權管控（tiered_policy）==========
#
# schema: tiered_policy（或相容 v_cc / v4.2）時由 tiered_policy.evaluate_tiered_policy 求值；
# permission_mode: normal|strict 決定 severity 對映，見 agentserver/permissions/tiered_policy.py。
# severity（normal）：LOW/MEDIUM→allow，HIGH/CRITICAL→ask；strict 下 MEDIUM→ask、CRITICAL→deny。
# rules[*].action: 可選顯式動作 allow|ask|deny；配置後優先於 severity 對映，適合敏感檔案讀取、
# 系統控制等不希望隨 permission_mode 漂移的規則。
# 內建引數規則 > 使用者 rules；整工具存在則不用 defaults；詳見 tiered_policy 模組說明。
#
# 三種動作: allow / ask / deny
permissions:
  enabled: false
  schema: tiered_policy
  permission_mode: normal

  defaults:
    "*": "allow"

  tools:
    bash: ask
    mcp_exec_command: ask
    create_terminal: ask
    write: ask
    write_file: ask
    edit_file: ask
    search_replace: ask
    write_memory: allow
    edit_memory: allow
    read_memory: allow
    memory_search: allow
    memory_get: allow
    todo_create: allow
    todo_insert: allow
    todo_complete: allow
    todo_remove: allow
    todo_list: allow
    # Coding Memory 工具許可權
    coding_memory_write: allow
    coding_memory_edit: allow
    coding_memory_read: allow
    # 外接記憶工具（External Memory — OpenJiuwen / Mem0 / OpenViking）
    ltm_search: allow
    ltm_search_summary: allow
    mem0_profile: allow
    mem0_search: allow
    mem0_conclude: allow
    viking_search: allow
    viking_read: allow
    viking_browse: allow
    viking_remember: allow
    viking_add_resource: allow
    mcp_free_search: allow
    mcp_paid_search: allow
    mcp_fetch_webpage: allow
    cron_list_jobs: allow
    cron_get_job: allow
    cron_create_job: allow
    cron_update_job: allow
    cron_delete_job: allow
    cron_toggle_job: allow
    cron_preview_job: allow

  rules:
    - id: shell_allow_dir
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "dir *"
      severity: LOW
    - id: shell_allow_ls
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "ls *"
      severity: LOW
    - id: shell_allow_pwd
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "pwd *"
      severity: LOW
    - id: shell_allow_cd
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "cd *"
      severity: LOW
    - id: shell_allow_echo
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "echo *"
      severity: LOW
    - id: shell_allow_cat
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "cat *"
      severity: LOW
    - id: shell_allow_type
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "type *"
      severity: LOW
    - id: shell_allow_head
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "head *"
      severity: LOW
    - id: shell_allow_tail
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "tail *"
      severity: LOW
    - id: shell_allow_git_status
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "git status *"
      severity: LOW
    - id: shell_allow_git_log
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "git log *"
      severity: LOW
    - id: shell_allow_git_diff
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "git diff *"
      severity: LOW
    - id: shell_allow_git_branch
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "git branch *"
      severity: LOW
    - id: shell_ask_rm
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "rm *"
      severity: HIGH
    - id: shell_ask_del
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "del *"
      severity: HIGH
    - id: shell_ask_rd
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "rd *"
      severity: HIGH
    - id: shell_ask_mv
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "mv *"
      severity: HIGH
    - id: shell_ask_cp
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "cp *"
      severity: HIGH
    - id: shell_ask_chmod
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "chmod *"
      severity: HIGH
    - id: shell_ask_chown
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "chown *"
      severity: HIGH
    - id: shell_ask_sensitive_file_reads
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: 're:(?i)(^|[\s;&|()])((cat|type|less|more|head|tail|grep|find|Get-Content|Select-String)\b[^;&|]*(id_rsa|id_ed25519|\.pem\b|\.pfx\b|\.key\b|\.kube/config|\.aws/(credentials|config)|\.npmrc\b|\.env(\.[A-Za-z0-9_-]+)?\b|authorized_keys|\.ssh/))'
      severity: HIGH
    - id: path_ask_ssh
      tools: [read_file, write_file, edit_file, read_text_file, write_text_file, write, read, glob_file_search, glob, list_dir, list_files, grep, search_replace]
      pattern: "**/.ssh/**"
      severity: HIGH
    - id: path_ask_env
      tools: [read_file, write_file, edit_file, read_text_file, write_text_file, write, read, glob_file_search, glob, list_dir, list_files, grep, search_replace]
      pattern: "**/.env*"
      severity: HIGH

  # 數字分身 owner-scoped 許可權（預設空，不生效）
  owner_scopes: {}
  deny_guidance_message: ""

  # 外部目錄訪問 (訪問 workspace 外路徑時的許可權)
  external_directory:
    "*": "ask"

browser:
  # chrome_path can be a string or per-OS map.
  # Example:
  # chrome_path:
  #   windows: "C:\\Users\\YOUR_USER\\AppData\\Local\\Google\\Chrome\\Application\\chrome.exe"
  #   macos: "/Applications/Google Chrome.app"
  #   linux: "/usr/bin/google-chrome"
  remote_debugging_address: "127.0.0.1"
  remote_debugging_port: 9222
  # empty means use launcher default profile path by OS
  user_data_dir: ""
  profile_directory: "Default"

updater:
  enabled: true
